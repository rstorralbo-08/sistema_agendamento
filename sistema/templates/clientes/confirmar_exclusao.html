{% extends 'base.html' %}

{% block title %}Excluir Cliente - Sistema de Serviços{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white fw-bold">
                Confirmar Exclusão
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5">Tem a certeza de que deseja remover o cliente <strong>{{ cliente.nome }}</strong>?</p>
                <p class="text-muted small">Esta ação não poderá ser revertida.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <a href="{% url 'clientes:listar' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Sim, Excluir</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
